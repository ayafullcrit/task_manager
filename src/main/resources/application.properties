spring.application.name=Testsec
# H2 in-memory database
spring.datasource.url=jdbc:postgresql://localhost:5432/learning_db
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mở H2 Console để xem data trực tiếp trên browser
spring.h2.console.enabled=true

jwt.secret=mySecretKeyThatIsAtLeast256BitsLongForHS256Algorithm12345
jwt.expiration=86400000

spring.rabbitmq.listener.simple.acknowledge-mode=manual